name: Lighthouse

# Audits the homepage the way a browser sees it — accessibility, best-practices,
# SEO, and performance — against the Firebase Hosting emulator. LHCI boots the
# emulator, waits for its "All emulators ready" line, then runs Lighthouse three
# times and asserts the category scores in .github/lighthouse/lighthouserc.json.
#
# Accessibility and SEO are hard gates. Best-practices and performance are
# warnings: Lighthouse's "Use HTTPS" audit always fails against the plain-HTTP
# local emulator, and perf swings with third-party analytics fetches — neither
# reflects production on Hosting's CDN.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Pull @martinzachariassen/design from GitHub Packages during install (.npmrc).
  packages: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit homepage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise (installs Bun from mise.toml)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # LHCI's startServerCommand (the Hosting emulator) serves dist/, so build
      # first.
      - name: Build
        run: mise run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ".github/lighthouse/lighthouserc.json"
