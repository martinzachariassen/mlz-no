name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token is all this workflow needs. Artifact upload/download between
# jobs uses the Actions runtime token, not the REST API, so no extra scope.
# `packages: read` lets `bun install` pull @martinzachariassen/design from GitHub
# Packages (see .npmrc); GitHub Packages requires auth even for public packages.
permissions:
  contents: read
  packages: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Installs the Bun version pinned in mise.toml — single source of truth,
      # no separate bun-version to keep in sync. Bun is the package manager and
      # build runner only; nothing Bun-specific runs in production.
      - name: Set up mise (installs Bun from mise.toml)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint & format check
        run: mise run lint

      - name: Type-check
        run: mise run typecheck

      - name: Build
        run: mise run build

      # Hand the exact production bundle to the smoke job so it tests what would
      # ship, rather than rebuilding a second copy.
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Matches firebase.json -> emulators.hosting.port.
      PORT: "5000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise (installs Bun from mise.toml)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      # firebase-tools itself is a devDependency; the frontend bundle comes from
      # the build job's artifact.
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Serve the built dist/ through the Firebase Hosting emulator, which runs
      # the same superstatic stack (redirects -> headers -> files -> rewrites ->
      # missing) that Hosting runs in production, and assert that the hardening
      # and cache policy still hold. Everything checked here comes from
      # firebase.json or from Hosting's built-in static-file behaviour — there is
      # no server code left to test.
      - name: Smoke-test the Firebase Hosting deployment
        run: |
          set -euo pipefail
          bunx firebase-tools emulators:start --only hosting --project mlz-no > emulator.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          # Wait up to 60s for the emulator to bind.
          for _ in $(seq 1 120); do
            curl -sf -o /dev/null "http://127.0.0.1:$PORT/" && break
            sleep 0.5
          done

          fail=0
          check() { # label expected actual
            if [ "$2" = "$3" ]; then
              echo "ok   $1 ($3)"
            else
              echo "FAIL $1: expected $2, got $3"
              fail=1
            fi
          }

          base="http://127.0.0.1:$PORT"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          check "GET / -> 200"          200 "$(code "$base/")"
          check "GET /robots -> 200"    200 "$(code "$base/robots.txt")"
          check "missing -> 404"        404 "$(code "$base/nope")"
          # Asserted as "did not serve the file" rather than a fixed status:
          # the emulator 404s this, but Hosting's edge resolves the `..` and
          # 302s to its own origin host, which then 404s. The redirect target
          # host is fixed by Hosting and not influenced by the path, so this is
          # a normalization quirk rather than an open redirect. What has to hold
          # in both is that nothing outside the deploy is ever returned.
          traversal="$(code "$base/%2e%2e/package.json")"
          if [ "$traversal" = "200" ]; then
            echo "FAIL traversal served a file (200)"
            fail=1
          else
            echo "ok   traversal did not serve a file ($traversal)"
          fi
          # firebase.json configures the deployment; the ignore list must keep it
          # from ever being uploaded and served.
          check "firebase.json -> 404"  404 "$(code "$base/firebase.json")"

          # Hosting serves static files for any method rather than rejecting
          # non-GET with a 405 the way the old Workers deployment did. Pinned
          # here so the change is deliberate: nothing has side effects, but a
          # future move back to a method-aware runtime should trip this.
          check "POST / -> 200"         200 "$(code -X POST "$base/")"

          # The custom 404 page must be the body, not Firebase's generic one.
          if curl -s "$base/nope" | grep -q 'data-accent'; then
            echo "ok   404 body is the custom page"
          else
            echo "FAIL 404 body is not the custom page"
            fail=1
          fi

          # The hardening headers from firebase.json must be on every response.
          for header in content-security-policy strict-transport-security x-content-type-options x-frame-options referrer-policy permissions-policy; do
            if curl -s -D - -o /dev/null "$base/" | grep -qi "^$header:"; then
              echo "ok   header $header present"
            else
              echo "FAIL header $header missing"
              fail=1
            fi
          done

          # Fingerprinted bundles must be immutably cacheable. This also proves
          # the last-match-wins ordering in firebase.json still holds: the
          # catch-all sets a no-cache policy that this block has to override.
          bundle="$(find dist/bundle -name '*.js' -print -quit)"
          if [ -z "$bundle" ]; then
            echo "FAIL no hashed bundle found in dist/bundle"
            fail=1
          else
            url="$base/bundle/$(basename "$bundle")"
            if curl -s -D - -o /dev/null "$url" | grep -qi '^cache-control:.*immutable'; then
              echo "ok   bundle is immutably cacheable"
            else
              echo "FAIL bundle missing immutable Cache-Control"
              fail=1
            fi
            # ...and that overriding Cache-Control did not drop the hardening.
            if curl -s -D - -o /dev/null "$url" | grep -qi '^content-security-policy:'; then
              echo "ok   bundle still carries the CSP"
            else
              echo "FAIL bundle lost the CSP to the cache override"
              fail=1
            fi
          fi

          # HTML must stay revalidated, or a deploy would be invisible for as
          # long as Hosting's default hour of caching.
          if curl -s -D - -o /dev/null "$base/" | grep -qi '^cache-control:.*must-revalidate'; then
            echo "ok   HTML is revalidated"
          else
            echo "FAIL HTML is not revalidated"
            fail=1
          fi

          # A stable-URL favicon must NOT be immutable, or it could never be
          # replaced for anyone who already loaded the old one.
          if curl -s -D - -o /dev/null "$base/assets/icons/favicon.svg" | grep -qi '^cache-control:.*immutable'; then
            echo "FAIL favicon marked immutable"
            fail=1
          else
            echo "ok   favicon is not immutable"
          fi

          # Compression is deliberately NOT asserted here: Content-Encoding is
          # added by Hosting's CDN in production, not by the local emulator, so
          # there is nothing to observe against it. It is verified implicitly by
          # the site working in production, not in this smoke test.

          if [ "$fail" -ne 0 ]; then
            echo "--- emulator log ---"
            cat emulator.log
          fi
          exit "$fail"
