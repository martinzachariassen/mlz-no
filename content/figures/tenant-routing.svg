<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" width="1500" height="560" role="img">
  <rect width="1500" height="560" fill="{{bg}}" />

  <defs>
    <marker id="tenant-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="{{muted}}" />
    </marker>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="48" y="68" font-size="24" letter-spacing="3" fill="{{fg}}">TENANT ROUTING</text>
    <line x1="48" y1="90" x2="1452" y2="90" stroke="{{border}}" stroke-width="2" />

    <text x="48" y="146" font-size="14" letter-spacing="2" fill="{{muted}}">REQUEST</text>
    <rect x="48" y="168" width="250" height="88" rx="10" fill="{{surface}}" stroke="{{border}}" stroke-width="2" />
    <text x="173" y="206" font-size="17" fill="{{fgSecondary}}" text-anchor="middle">POST /v2/orders</text>
    <text x="173" y="232" font-size="15" fill="{{muted}}" text-anchor="middle">tenant: acme</text>

    <path d="M298 212 L392 212" stroke="{{muted}}" stroke-width="2" marker-end="url(#tenant-arrow)" />

    <text x="400" y="146" font-size="14" letter-spacing="2" fill="{{muted}}">ROUTER</text>
    <rect x="400" y="168" width="260" height="240" rx="10" fill="{{sunken}}" stroke="{{accentDeep}}" stroke-width="2.5" />
    <text x="530" y="212" font-size="17" fill="{{fg}}" text-anchor="middle">resolve tenant</text>
    <line x1="428" y1="234" x2="632" y2="234" stroke="{{border}}" stroke-width="1.5" />
    <text x="530" y="270" font-size="15" fill="{{fgSecondary}}" text-anchor="middle">pool = shard(acme)</text>
    <text x="530" y="302" font-size="15" fill="{{fgSecondary}}" text-anchor="middle">quota = plan(acme)</text>
    <text x="530" y="334" font-size="15" fill="{{fgSecondary}}" text-anchor="middle">key = kms(acme)</text>
    <text x="530" y="376" font-size="14" fill="{{accentDeep}}" text-anchor="middle">one lookup, cached 60s</text>

    <path d="M660 212 L780 176" stroke="{{muted}}" stroke-width="2" marker-end="url(#tenant-arrow)" />
    <path d="M660 288 L780 288" stroke="{{muted}}" stroke-width="2" marker-end="url(#tenant-arrow)" />
    <path d="M660 364 L780 400" stroke="{{muted}}" stroke-width="2" marker-end="url(#tenant-arrow)" />

    <text x="792" y="122" font-size="14" letter-spacing="2" fill="{{muted}}">ISOLATED POOLS</text>

    <rect x="792" y="140" width="330" height="76" rx="10" fill="{{surface}}" stroke="{{border}}" stroke-width="2" />
    <text x="820" y="186" font-size="17" fill="{{fgSecondary}}">pool-eu-1</text>
    <text x="1094" y="186" font-size="15" fill="{{accentDeep}}" text-anchor="end">acme</text>

    <rect x="792" y="250" width="330" height="76" rx="10" fill="{{surface}}" stroke="{{border}}" stroke-width="2" />
    <text x="820" y="296" font-size="17" fill="{{fgSecondary}}">pool-eu-2</text>
    <text x="1094" y="296" font-size="15" fill="{{muted}}" text-anchor="end">14 tenants</text>

    <rect x="792" y="360" width="330" height="76" rx="10" fill="{{surface}}" stroke="{{border}}" stroke-width="2" />
    <text x="820" y="406" font-size="17" fill="{{fgSecondary}}">pool-dedicated</text>
    <text x="1094" y="406" font-size="15" fill="{{muted}}" text-anchor="end">2 tenants</text>

    <rect x="1178" y="140" width="274" height="296" rx="10" fill="{{sunken}}" stroke="{{border}}" stroke-width="2" stroke-dasharray="6 6" />
    <text x="1315" y="186" font-size="15" letter-spacing="2" fill="{{muted}}" text-anchor="middle">NOISY NEIGHBOUR</text>
    <text x="1315" y="248" font-size="34" fill="{{warm}}" text-anchor="middle">pool-eu-2</text>
    <text x="1315" y="286" font-size="15" fill="{{fgSecondary}}" text-anchor="middle">saturated 09:41</text>
    <line x1="1206" y1="316" x2="1424" y2="316" stroke="{{border}}" stroke-width="1.5" />
    <text x="1315" y="356" font-size="15" fill="{{fgSecondary}}" text-anchor="middle">acme unaffected</text>
    <text x="1315" y="392" font-size="15" fill="{{fgSecondary}}" text-anchor="middle">p99 held at 84 ms</text>

    <text x="48" y="512" font-size="15" fill="{{muted}}">Every request carries a tenant; every tenant resolves to exactly one pool, one quota and one key.</text>
  </g>
</svg>
