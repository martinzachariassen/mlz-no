name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token is all this workflow needs. Every dependency, including
# @martinzachariassen/design, comes from public npm, so the install needs no
# credential at all.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Installs the Bun version pinned in mise.toml — single source of truth,
      # no separate bun-version to keep in sync. Bun is the package manager and
      # build runner only; nothing Bun-specific runs in production.
      - name: Set up mise (installs Bun from mise.toml)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: mise run lint

      - name: Type-check
        run: mise run typecheck

      - name: Build
        run: mise run build

      # Serves the dist/ just built through the Hosting emulator and asserts the
      # parts of firebase.json that can fail silently. Runs in this job rather
      # than a separate one so it tests the bundle already on disk — no artifact
      # round-trip, no second checkout and install.
      #
      # Scope is deliberately narrow. firebase.json has no type checker and no
      # linter, and its `headers` array is *last match wins*, so reordering it
      # makes the catch-all `max-age=0` clobber the bundle's immutable caching
      # with no other signal. Everything below is a property of that ordering,
      # of the hardening block, or of the 404.html filename contract.
      #
      # Not asserted, on purpose: that / and /robots.txt return 200 (the build
      # fails first), how Hosting resolves traversal or handles non-GET (that is
      # superstatic's behaviour, not this repo's config), and anything about
      # compression (added at the CDN edge, invisible to the emulator).
      # Emulator behaviour is not production behaviour — see #29 — so this only
      # asserts what holds in both.
      - name: Check firebase.json headers and cache policy
        env:
          # Matches firebase.json -> emulators.hosting.port.
          PORT: "5000"
        run: |
          set -euo pipefail
          base="http://127.0.0.1:$PORT"

          bunx firebase-tools emulators:start --only hosting --project mlz-no > emulator.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          # Wait up to 60s for the emulator to bind.
          for _ in $(seq 1 120); do
            curl -sf -o /dev/null "$base/" && break
            sleep 0.5
          done

          fail=0
          ok()  { echo "ok   $1"; }
          bad() { echo "FAIL $1"; fail=1; }

          # Response headers for a URL, one per line.
          headers() { curl -s -D - -o /dev/null "$1"; }

          # The hardening block must be on every response; a deleted block or a
          # mistyped key is otherwise invisible until someone scans the site.
          for header in content-security-policy strict-transport-security x-content-type-options x-frame-options referrer-policy permissions-policy; do
            if headers "$base/" | grep -qi "^$header:"; then
              ok "header $header present"
            else
              bad "header $header missing"
            fi
          done

          # dist/404.html is served with a real 404 for unknown paths, and its
          # body must be the custom page rather than Firebase's generic one.
          # vite.config.ts builds that file; drop the input and this degrades
          # silently, because the filename is the entire contract.
          status="$(curl -s -o /dev/null -w '%{http_code}' "$base/nope")"
          if [ "$status" = "404" ] && curl -s "$base/nope" | grep -q 'data-accent'; then
            ok "unknown path serves the custom 404 page"
          else
            bad "unknown path did not serve the custom 404 page (status $status)"
          fi

          # firebase.json configures the deployment; the explicit ignore list
          # must keep it from ever being uploaded and served.
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/firebase.json")" = "404" ]; then
            ok "firebase.json is not served"
          else
            bad "firebase.json is served"
          fi

          # Fingerprinted bundles must stay immutably cacheable. This is the
          # check that catches a reordered headers array.
          bundle="$(find dist/bundle -name '*.js' -print -quit)"
          if [ -z "$bundle" ]; then
            bad "no hashed bundle found in dist/bundle"
          else
            url="$base/bundle/$(basename "$bundle")"

            if headers "$url" | grep -qi '^cache-control:.*immutable'; then
              ok "bundle is immutably cacheable"
            else
              bad "bundle missing immutable Cache-Control"
            fi

            # Overriding Cache-Control must not drop the hardening: the override
            # applies per-header, not per-block, and this proves it.
            if headers "$url" | grep -qi '^content-security-policy:'; then
              ok "bundle still carries the CSP"
            else
              bad "bundle lost the CSP to the cache override"
            fi
          fi

          # HTML must stay revalidated, or a deploy is invisible for as long as
          # Hosting's default hour of caching.
          if headers "$base/" | grep -qi '^cache-control:.*must-revalidate'; then
            ok "HTML is revalidated"
          else
            bad "HTML is not revalidated"
          fi

          # A stable-URL favicon must NOT be immutable, or it could never be
          # replaced for anyone who already loaded the old one. The 200 is
          # asserted first because the rest is a negative check: a renamed or
          # missing file would 404, carry no Cache-Control at all, and so pass
          # the immutability test vacuously.
          favicon="$base/assets/icons/favicon.svg"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$favicon")" != "200" ]; then
            bad "favicon is not served (cannot check its cache policy)"
          elif headers "$favicon" | grep -qi '^cache-control:.*immutable'; then
            bad "favicon marked immutable"
          else
            ok "favicon is served and not immutable"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "--- emulator log ---"
            cat emulator.log
          fi
          exit "$fail"
