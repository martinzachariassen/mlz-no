name: Deploy

# Publishes public/ to Firebase Hosting; no build step.
#
# Keyless auth: GitHub's OIDC token is exchanged via Workload Identity
# Federation for short-lived credentials impersonating the deploy service
# account. Both are managed in infra/ and exposed as repo *variables*:
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT: mlz-no

permissions:
  contents: read
  # Required for GitHub to mint the OIDC token that WIF exchanges.
  id-token: write

# Newest commit wins, but an in-flight deploy finishes rather than shipping half-uploaded assets.
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run lint

      - name: Brand files in sync with tokens.json
        run: bun run brand:check

      - name: Check firebase.json headers, cache policy and /brand
        run: ./scripts/verify.sh

  deploy:
    name: deploy to Firebase Hosting
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://mlz.no
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No cache restore in the job that publishes: a lower-trust workflow
      # that can write default-branch caches must not be able to alter what
      # ships (see "Release workflows" in the mise-action README).
      - name: Set up tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: bun
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Impersonation gives a plain OAuth token; firebase-tools has a history
      # of failing on raw external_account files.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Uses the devDependency-pinned firebase-tools, same version CI tested.
      - name: Deploy
        run: bunx firebase-tools deploy --only hosting --project "$PROJECT" --non-interactive
