name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Catch newly-disclosed patterns in code that hasn't changed.
  schedule:
    - cron: "23 5 * * 1"

# Least privilege at the top level; the analyze job elevates only the
# security-events write scope it needs to upload results to code scanning.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: ${{ matrix.language }}

      # No build step: CodeQL analyzes the TypeScript source directly.
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:${{ matrix.language }}"
