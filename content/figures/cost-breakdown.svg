<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img">
  <rect width="1600" height="600" fill="{{bg}}" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="48" y="68" font-size="24" letter-spacing="3" fill="{{fg}}">COST PER SERVICE</text>
    <line x1="48" y1="90" x2="1552" y2="90" stroke="{{border}}" stroke-width="2" />

    <rect x="1180" y="118" width="20" height="20" fill="{{muted}}" />
    <text x="1212" y="135" font-size="15" fill="{{muted}}">before</text>
    <rect x="1320" y="118" width="20" height="20" fill="{{accentDeep}}" />
    <text x="1352" y="135" font-size="15" fill="{{fgSecondary}}">after attribution</text>

    <line x1="140" y1="470" x2="1552" y2="470" stroke="{{border}}" stroke-width="2" />
    <line x1="140" y1="352" x2="1552" y2="352" stroke="{{border}}" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="140" y1="234" x2="1552" y2="234" stroke="{{border}}" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="140" y1="176" x2="1552" y2="176" stroke="{{border}}" stroke-width="1" stroke-dasharray="4 8" />

    <g font-size="14" fill="{{muted}}" text-anchor="end">
      <text x="120" y="476">0</text>
      <text x="120" y="358">20k</text>
      <text x="120" y="240">40k</text>
      <text x="120" y="182">50k</text>
    </g>

    <g>
      <rect x="200" y="182" width="72" height="288" fill="{{muted}}" />
      <rect x="284" y="288" width="72" height="182" fill="{{accentDeep}}" />
      <text x="278" y="504" font-size="16" fill="{{fgSecondary}}" text-anchor="middle">search</text>
      <text x="278" y="530" font-size="14" fill="{{muted}}" text-anchor="middle">&#8722;37%</text>
    </g>

    <g>
      <rect x="452" y="246" width="72" height="224" fill="{{muted}}" />
      <rect x="536" y="316" width="72" height="154" fill="{{accentDeep}}" />
      <text x="530" y="504" font-size="16" fill="{{fgSecondary}}" text-anchor="middle">ingest</text>
      <text x="530" y="530" font-size="14" fill="{{muted}}" text-anchor="middle">&#8722;31%</text>
    </g>

    <g>
      <rect x="704" y="300" width="72" height="170" fill="{{muted}}" />
      <rect x="788" y="318" width="72" height="152" fill="{{accentDeep}}" />
      <text x="782" y="504" font-size="16" fill="{{fgSecondary}}" text-anchor="middle">warehouse</text>
      <text x="782" y="530" font-size="14" fill="{{muted}}" text-anchor="middle">&#8722;11%</text>
    </g>

    <g>
      <rect x="956" y="336" width="72" height="134" fill="{{muted}}" />
      <rect x="1040" y="398" width="72" height="72" fill="{{accentDeep}}" />
      <text x="1034" y="504" font-size="16" fill="{{fgSecondary}}" text-anchor="middle">batch jobs</text>
      <text x="1034" y="530" font-size="14" fill="{{muted}}" text-anchor="middle">&#8722;46%</text>
    </g>

    <g>
      <rect x="1208" y="392" width="72" height="78" fill="{{muted}}" />
      <rect x="1292" y="360" width="72" height="110" fill="{{warm}}" />
      <text x="1286" y="504" font-size="16" fill="{{fgSecondary}}" text-anchor="middle">observability</text>
      <text x="1286" y="530" font-size="14" fill="{{warm}}" text-anchor="middle">+41%</text>
    </g>

    <text x="48" y="576" font-size="15" fill="{{muted}}">The one line that went up was the one nobody had been able to see before.</text>
  </g>
</svg>
