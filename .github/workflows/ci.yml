name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: every dependency comes from the public npm registry.
permissions:
  contents: read

# Newer pushes cancel in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Bun version comes from mise.toml — single source of truth. Bun is
      # just the package manager here; the site is static files, no build.
      - name: Set up mise (installs Bun from mise.toml)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run lint

      # Serves public/ through the Hosting emulator and asserts what
      # firebase.json can't check itself — notably that `headers` is
      # last-match-wins, so a reorder could silently let the catch-all
      # max-age=0 clobber a specific cache rule. The assertions live in
      # scripts/smoke.sh because deploy.yml runs the same ones against
      # production afterwards, and two copies would drift.
      - name: Smoke test public/ through the Hosting emulator
        env:
          # Matches firebase.json -> emulators.hosting.port.
          PORT: "5000"
        run: |
          set -euo pipefail
          base="http://127.0.0.1:$PORT"

          bunx firebase-tools emulators:start --only hosting --project mlz-no > emulator.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          # Wait up to 60s for the emulator to bind.
          for _ in $(seq 1 120); do
            curl -sf -o /dev/null "$base/" && break
            sleep 0.5
          done

          if ! scripts/smoke.sh "$base"; then
            echo "--- emulator log ---"
            cat emulator.log
            exit 1
          fi
