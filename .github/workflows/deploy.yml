name: Deploy

# Publishes public/ to Firebase Hosting — there is no build step.
#
# Authentication to Google Cloud is keyless: GitHub mints an OIDC token, Workload
# Identity Federation exchanges it for short-lived credentials, and those
# impersonate the deploy service account. Nothing secret is stored in this repo,
# so the two settings below are repository *variables*, not secrets:
#   GCP_WORKLOAD_IDENTITY_PROVIDER — full provider resource path
#   GCP_SERVICE_ACCOUNT            — gh-deploy@mlz-no.iam.gserviceaccount.com
#
# The provider is locked to this repository with an attribute condition, so no
# other repo can exchange a token against the project.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required for GitHub to mint the OIDC token that WIF exchanges.
  id-token: write

# Never let two deploys race; the newest commit on main wins, but an in-flight
# deploy is allowed to finish rather than shipping a half-uploaded asset set.
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://mlz.no
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise (installs Bun from mise.toml)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Impersonates the deploy service account rather than using the federated
      # credential directly: firebase-tools consumes a plain OAuth access token
      # reliably, but has a history of failing on raw external_account files.
      # create_credentials_file and export_environment_variables default to true,
      # so GOOGLE_APPLICATION_CREDENTIALS is set for the step below.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: mlz-no
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # firebase-tools is pinned as a devDependency, so the deploy uses the same
      # version CI tested against rather than whatever a marketplace action
      # resolves at run time.
      - name: Deploy
        run: bunx firebase-tools deploy --only hosting --project mlz-no --non-interactive
