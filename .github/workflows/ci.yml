name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token is all this workflow needs. Artifact upload/download between
# jobs uses the Actions runtime token, not the REST API, so no extra scope.
# `packages: read` lets `bun install` pull @martinzachariassen/design from GitHub
# Packages (see .npmrc); GitHub Packages requires auth even for public packages.
permissions:
  contents: read
  packages: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Installs the Bun version pinned in mise.toml — single source of truth,
      # no separate bun-version to keep in sync. Bun is the package manager and
      # build runner only; nothing Bun-specific runs in production.
      - name: Set up mise (installs Bun from mise.toml)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint & format check
        run: mise run lint

      - name: Type-check
        run: mise run typecheck

      - name: Build
        run: mise run build

      # Hand the exact production bundle to the smoke job so it tests what would
      # ship, rather than rebuilding a second copy.
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORT: "4173"
      # wrangler dev runs entirely on the local workerd runtime — no Cloudflare
      # account or API token is involved.
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise (installs Bun from mise.toml)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      # wrangler itself is a devDependency; the frontend bundle comes from the
      # build job's artifact.
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Serve the built dist/ through the same Workers runtime Cloudflare runs
      # in production, and assert the hardening and cache policy still hold.
      # Everything checked here comes from public/_headers or from Workers'
      # built-in static-asset behaviour — there is no server code left to test.
      - name: Smoke-test the Workers static-asset deployment
        run: |
          set -euo pipefail
          bunx wrangler dev --ip 127.0.0.1 --port "$PORT" > wrangler-dev.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          # workerd takes longer to boot than a plain JS process; wait up to 60s.
          for _ in $(seq 1 120); do
            curl -sf -o /dev/null "http://127.0.0.1:$PORT/" && break
            sleep 0.5
          done

          fail=0
          check() { # label expected actual
            if [ "$2" = "$3" ]; then
              echo "ok   $1 ($3)"
            else
              echo "FAIL $1: expected $2, got $3"
              fail=1
            fi
          }

          base="http://127.0.0.1:$PORT"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          check "GET / -> 200"          200 "$(code "$base/")"
          check "GET /robots -> 200"    200 "$(code "$base/robots.txt")"
          check "POST / -> 405"         405 "$(code -X POST "$base/")"
          check "missing -> 404"        404 "$(code "$base/nope")"
          check "traversal -> 404"      404 "$(code "$base/%2e%2e/package.json")"
          # _headers configures the deployment; it must never be servable itself.
          check "_headers -> 404"       404 "$(code "$base/_headers")"

          # The hardening headers from public/_headers must be on every response.
          for header in content-security-policy strict-transport-security x-content-type-options x-frame-options referrer-policy permissions-policy; do
            if curl -s -D - -o /dev/null "$base/" | grep -qi "^$header:"; then
              echo "ok   header $header present"
            else
              echo "FAIL header $header missing"
              fail=1
            fi
          done

          # Fingerprinted bundles must be immutably cacheable — the cache policy
          # in public/_headers that the old Bun + Hono server never sent.
          #
          # Compression is deliberately NOT asserted here: Content-Encoding is
          # added by Cloudflare's edge in production, not by the local workerd
          # runtime that `wrangler dev` runs, so there is nothing to observe
          # against the dev server. It is verified implicitly by the site working
          # in production, not in this smoke test.
          bundle="$(find dist/bundle -name '*.js' -print -quit)"
          if [ -z "$bundle" ]; then
            echo "FAIL no hashed bundle found in dist/bundle"
            fail=1
          else
            url="$base/bundle/$(basename "$bundle")"
            if curl -s -D - -o /dev/null "$url" | grep -qi '^cache-control:.*immutable'; then
              echo "ok   bundle is immutably cacheable"
            else
              echo "FAIL bundle missing immutable Cache-Control"
              fail=1
            fi
          fi

          # A stable-URL favicon must NOT be immutable, or it could never be
          # replaced for anyone who already loaded the old one.
          if curl -s -D - -o /dev/null "$base/assets/icons/favicon.svg" | grep -qi '^cache-control:.*immutable'; then
            echo "FAIL favicon marked immutable"
            fail=1
          else
            echo "ok   favicon is not immutable"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "--- wrangler dev log ---"
            cat wrangler-dev.log
          fi
          exit "$fail"
