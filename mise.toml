[tools]
bun = "1.3.14"

[tasks.dev]
description = "Serve public/ through the local Firebase Hosting emulator on http://127.0.0.1:5000 (applies firebase.json)"
run = "bun run dev"

[tasks.deploy]
description = "Deploy public/ to Firebase Hosting with the Firebase CLI"
run = "bun run deploy"

[tasks.format]
description = "Format and auto-fix with Biome"
run = "bun run format"

[tasks.lint]
description = "Lint + format check with Biome (read-only)"
run = "bun run lint"
