name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: every dependency comes from the public npm registry.
permissions:
  contents: read

# Newer pushes cancel in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Tool versions come from mise.toml — single source of truth. Bun is
      # just the package manager here; the site is static files, no build.
      - name: Set up tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run lint

      # public/brand/ is generated from tokens.json (scripts/brand.js) and
      # committed, since there's no build step at deploy. Fails if someone
      # edited tokens.json without regenerating, or edited an output by hand.
      - name: Brand files in sync with tokens.json
        run: bun run brand:check

      - name: Check firebase.json headers, cache policy and /brand
        run: ./scripts/verify.sh

  # Plan/apply run by hand (infra/README.md); CI only checks the code.
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: terraform

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init (providers only, from the lock file)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate
