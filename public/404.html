<!doctype html>
<!-- Firebase Hosting serves this file with a real 404 status for any unknown
     path — that's the entire contract, there's no config key for it. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <script src="/theme-init.js"></script>
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex" />
    <title>404 — Page Not Found · Martin Zachariassen</title>
    <meta
      name="description"
      content="The page you were looking for does not exist."
    />

    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/icons/favicon-192.png"
    />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="/assets/site.webmanifest" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ebeff2"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#151619"
    />

    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/topbar.css" />
    <link rel="stylesheet" href="/css/hero.css" />
    <link rel="stylesheet" href="/css/buttons.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/motion.css" />
    <link rel="stylesheet" href="/css/terminal.css" />

    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="e73d093f-ea9e-4839-8c5f-3dd4888a3c36"
    ></script>
  </head>
  <body>
    <header class="wrap topbar rise delay-50">
      <a href="/" aria-label="MLZ home" class="brand">
        <svg
          class="brand-mark"
          width="16"
          height="16"
          viewBox="0 0 32 32"
          fill="none"
          role="img"
          aria-label="MLZ"
        >
          <rect x="1" y="1" width="30" height="30" rx="6" fill="var(--fg)" />
          <polygon
            points="7,25 7,7 11.5,7 16,18.5 20.5,7 25,7 25,25"
            fill="var(--bg)"
          />
        </svg>
        <span class="brand-word" data-glitch>mlz<span class="period">.</span></span>
      </a>

      <div class="topbar-right">
        <span class="since"
          ><span class="cursor" aria-hidden="true">▮</span
          ><span data-glitch>Building since 2017</span></span
        >
        <button
          type="button"
          class="theme-toggle"
          data-theme-toggle
          aria-label="Toggle colour theme"
        >
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="wrap hero">
      <h1 class="rise delay-150">4<span class="glitch-accent">0</span>4</h1>

      <p class="eyebrow rise delay-450">
        <span class="glitch" data-glitch>Page not found</span>
      </p>

      <div class="terminal rise delay-550" data-terminal>
        <div class="terminal-log" data-terminal-log>
          <p>
            <span class="prompt-user">guest@mlz.no</span
            ><span class="prompt-sep">:~$ </span>cd
            <span data-notfound-path>/</span>
          </p>
          <p class="no-such">cd: no such file or directory</p>
          <p class="quip" data-notfound-quip></p>
          <p class="hint">
            type <span class="cmd">help</span> to look around
          </p>
        </div>
        <p class="terminal-line">
          <span class="prompt-user">guest@mlz.no</span
          ><span class="prompt-sep">:~$ </span
          ><input
            id="terminal-input"
            class="terminal-input"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="try 'help'"
            aria-label="Terminal — type help for a list of commands"
            data-terminal-input
          />
        </p>
      </div>

      <nav class="links links-narrow rise delay-700">
        <a class="btn" href="/" data-umami-event="notfound-home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5l-7 7 7 7" /><path d="M4 12h16" /></svg>
          <span data-glitch>Back home</span>
        </a>
      </nav>
    </main>

    <footer class="rise delay-850">
      <div class="wrap footer-row">
        <span data-glitch>© 2026 · Martin Zachariassen</span>
        <span data-glitch>59°N · 10°E</span>
      </div>
    </footer>

    <script src="/js/theme-toggle.js" defer></script>
    <script src="/js/glitch.js" defer></script>
    <script src="/js/terminal.js" defer></script>
  </body>
</html>
