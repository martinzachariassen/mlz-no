<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520" role="img">
  <rect width="1400" height="520" fill="{{bg}}" />

  <defs>
    <marker id="release-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="{{muted}}" />
    </marker>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="48" y="68" font-size="24" letter-spacing="3" fill="{{fg}}">RELEASE TRAIN</text>
    <line x1="48" y1="90" x2="1352" y2="90" stroke="{{border}}" stroke-width="2" />

    <line x1="120" y1="248" x2="1290" y2="248" stroke="{{border}}" stroke-width="2" />

    <g>
      <circle cx="120" cy="248" r="13" fill="{{bg}}" stroke="{{accentDeep}}" stroke-width="3" />
      <text x="120" y="200" font-size="17" fill="{{fgSecondary}}" text-anchor="middle">merge</text>
      <text x="120" y="298" font-size="15" fill="{{muted}}" text-anchor="middle">00:00</text>
    </g>

    <g>
      <circle cx="412" cy="248" r="13" fill="{{bg}}" stroke="{{accentDeep}}" stroke-width="3" />
      <text x="412" y="200" font-size="17" fill="{{fgSecondary}}" text-anchor="middle">build + test</text>
      <text x="412" y="298" font-size="15" fill="{{muted}}" text-anchor="middle">06:20</text>
    </g>

    <g>
      <circle cx="705" cy="248" r="13" fill="{{bg}}" stroke="{{accentDeep}}" stroke-width="3" />
      <text x="705" y="200" font-size="17" fill="{{fgSecondary}}" text-anchor="middle">canary 1%</text>
      <text x="705" y="298" font-size="15" fill="{{muted}}" text-anchor="middle">08:05</text>
    </g>

    <g>
      <circle cx="997" cy="248" r="13" fill="{{bg}}" stroke="{{accentDeep}}" stroke-width="3" />
      <text x="997" y="200" font-size="17" fill="{{fgSecondary}}" text-anchor="middle">ramp 25%</text>
      <text x="997" y="298" font-size="15" fill="{{muted}}" text-anchor="middle">18:40</text>
    </g>

    <g>
      <circle cx="1290" cy="248" r="15" fill="{{accentDeep}}" />
      <text x="1290" y="200" font-size="17" fill="{{fg}}" text-anchor="middle">full fleet</text>
      <text x="1290" y="298" font-size="15" fill="{{accentDeep}}" text-anchor="middle">31:10</text>
    </g>

    <path d="M997 340 C 900 418, 800 418, 705 340" fill="none" stroke="{{warm}}" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#release-arrow)" />
    <text x="851" y="446" font-size="15" fill="{{warm}}" text-anchor="middle">auto-rollback on error budget burn &#183; 90 s</text>

    <text x="48" y="146" font-size="15" letter-spacing="2" fill="{{muted}}">ONE TRAIN A DAY &#183; ANY STAGE CAN STOP IT &#183; NOBODY WAITS FOR A WINDOW</text>
  </g>
</svg>
