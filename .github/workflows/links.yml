name: Link Check

# Catches dead links and missing assets in the static site — the markup, the
# sitemap, the manifest, robots.txt. The weekly run also catches external links
# (GitHub, LinkedIn) that rot after we last touched the code.
# Weekly only. The local asset paths are already covered by the CI smoke test
# and by Lighthouse loading the page; what nothing else catches is an external
# profile URL (GitHub, LinkedIn) rotting without anyone touching the code, and
# that needs a cron rather than a push.
on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: check links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # --root-dir resolves root-relative hrefs (/assets/…, /favicon.ico)
      # against the served directory, exactly as the browser would. lychee
      # requires an absolute path here, so anchor it to the checkout root.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --root-dir ${{ github.workspace }}/public
            --include-mail=false
            --cache
            --max-cache-age 1d
            index.html
            public/sitemap.xml
            public/site.webmanifest
            public/robots.txt
          fail: true
