name: GCP auth check

# Weekly canary: fails loudly if WIF or the deploy service account broke,
# instead of on the next real deploy.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  PROJECT: mlz-no

permissions:
  contents: read
  id-token: write

jobs:
  auth:
    name: gcp-auth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Check Hosting access
        run: bunx firebase-tools hosting:channel:list --project "$PROJECT" --non-interactive
