<!doctype html>
<!-- Source for public/assets/social/og.png (1200×630). Not deployed — it
     lives outside public/. Uses the site's own fonts and light-theme
     colours (public/css/tokens.css), so regenerate it when those change.
     See README → "Social card". -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mlz.no social card</title>
    <style>
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 400;
        src: url("/public/assets/fonts/ibm-plex-mono-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 700;
        src: url("/public/assets/fonts/ibm-plex-mono-700.woff2") format("woff2");
      }
      @font-face {
        font-family: "Newsreader";
        font-style: italic;
        font-weight: 200 800;
        src: url("/public/assets/fonts/newsreader-italic-variable.woff2")
          format("woff2");
      }

      :root {
        --bg: oklch(0.95 0.006 250);
        --fg: oklch(0.18 0.006 250);
        --fg-secondary: oklch(0.36 0.006 250);
        --border: oklch(0.85 0.008 250);
        --accent-deep: oklch(0.44 0.12 285);
        --mono: "IBM Plex Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--mono);
      }

      .card {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 64px 80px 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .brand svg {
        width: 40px;
        height: 40px;
      }

      .brand-word {
        font-weight: 700;
        font-size: 34px;
        letter-spacing: -0.03em;
      }

      .accent {
        color: var(--accent-deep);
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 36px;
      }

      h1 {
        margin: 0;
        font-family: "Newsreader", serif;
        font-style: italic;
        font-weight: 500;
        font-variation-settings: "opsz" 72;
        font-size: 128px;
        line-height: 0.96;
      }

      .eyebrow {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--fg-secondary);
      }

      .eyebrow .accent {
        margin-inline: 14px;
      }

      footer {
        display: flex;
        justify-content: space-between;
        padding: 26px 0 30px;
        border-top: 1px solid var(--border);
        font-size: 18px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--fg-secondary);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <header class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="6" fill="currentColor" />
          <polygon
            points="7,25 7,7 11.5,7 16,18.5 20.5,7 25,7 25,25"
            fill="var(--bg)"
          />
        </svg>
        <span class="brand-word">mlz<span class="accent">.</span></span>
      </header>

      <main>
        <h1>Martin<br />Zachariassen</h1>
        <p class="eyebrow">
          Senior Software Developer<span class="accent">/</span>Oslo, Norway
        </p>
      </main>

      <footer>
        <span>mlz.no</span>
        <span>59°N · 10°E</span>
      </footer>
    </div>
  </body>
</html>
