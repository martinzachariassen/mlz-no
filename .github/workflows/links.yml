name: Link Check

# Catches dead links and missing assets in the static site — the markup, the
# sitemap, the manifest, robots.txt. The weekly run also catches external links
# (GitHub, LinkedIn) that rot after we last touched the code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

concurrency:
  group: links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: check links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # --root-dir resolves root-relative hrefs (/assets/…, /favicon.ico)
      # against the served directory, exactly as the browser would. lychee
      # requires an absolute path here, so anchor it to the checkout root.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --root-dir ${{ github.workspace }}/public
            --include-mail=false
            --cache
            --max-cache-age 1d
            index.html
            public/sitemap.xml
            public/site.webmanifest
            public/robots.txt
          fail: true
