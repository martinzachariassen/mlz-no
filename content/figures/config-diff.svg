<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img">
  <rect width="900" height="620" fill="{{bg}}" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="48" y="76" font-size="24" letter-spacing="3" fill="{{fg}}">CONFIG PUBLISH</text>
    <line x1="48" y1="98" x2="852" y2="98" stroke="{{border}}" stroke-width="2" />

    <rect x="48" y="140" width="804" height="380" rx="10" fill="{{surface}}" stroke="{{border}}" stroke-width="2" />
    <g fill="{{muted}}">
      <circle cx="80" cy="172" r="7" />
      <circle cx="108" cy="172" r="7" />
      <circle cx="136" cy="172" r="7" />
    </g>
    <text x="450" y="178" font-size="16" letter-spacing="1" fill="{{fgSecondary}}" text-anchor="middle">checkout-service.yaml &#183; schema valid</text>
    <line x1="48" y1="196" x2="852" y2="196" stroke="{{border}}" stroke-width="2" />

    <g font-size="20">
      <text x="80" y="252" fill="{{muted}}">timeout_ms:</text>
      <text x="330" y="252" fill="{{warm}}" text-decoration="line-through">1500</text>
      <text x="430" y="252" fill="{{accentDeep}}">800</text>

      <text x="80" y="304" fill="{{muted}}">retries:</text>
      <text x="330" y="304" fill="{{warm}}" text-decoration="line-through">1</text>
      <text x="380" y="304" fill="{{accentDeep}}">3</text>

      <text x="80" y="356" fill="{{muted}}">circuit_breaker:</text>
      <text x="420" y="356" fill="{{accentDeep}}">enabled</text>
    </g>

    <line x1="80" y1="400" x2="820" y2="400" stroke="{{border}}" stroke-width="1.5" />
    <circle cx="96" cy="440" r="6" fill="{{accentDeep}}" />
    <text x="116" y="446" font-size="18" fill="{{fgSecondary}}">validated against schema, published</text>
    <text x="80" y="490" font-size="16" fill="{{muted}}">v118 &#8594; v119 &#183; by pipeline-ops &#183; 09:41:02</text>
  </g>
</svg>
