version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # @martinzachariassen/design is published to GitHub Packages, which requires
    # auth even for public packages, and Dependabot does not inherit the Actions
    # GITHUB_TOKEN — it runs in its own credential context.
    #
    # Giving it a credential (a `registries:` block with a classic PAT) does work
    # for auth, but credential-based .npmrc generation then outranks the
    # committed .npmrc: during lockfile regeneration Dependabot routed unrelated
    # scoped packages through GitHub Packages too, writing npm.pkg.github.com
    # URLs for five @types/* packages that only exist on npmjs.org. CI then 403s
    # on `bun install --frozen-lockfile`. See #33.
    #
    # Not worth solving. This package is mine, it is published rarely, and I know
    # when it happens — so it is bumped by hand:
    #
    #     bun update @martinzachariassen/design
    #
    # That keeps Dependabot on public npm only: no PAT, no secret to expire, no
    # rewritten lockfile.
    ignore:
      - dependency-name: "@martinzachariassen/design"
    # One grouped PR per week keeps the noise down
    groups:
      bun:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
