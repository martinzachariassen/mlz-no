name: Deploy

# Builds dist/ and publishes it to Cloudflare Workers as static assets.
#
# The deploy runs from Actions rather than Cloudflare's own Git integration
# ("Workers Builds") because the build needs a GitHub Packages token to install
# @martinzachariassen/design (see .npmrc). Actions supplies that natively via
# the job's GITHUB_TOKEN with `packages: read`, so no long-lived PAT has to be
# copied into Cloudflare.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — the account the Worker lives in
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Never let two deploys race; the newest commit on main wins, but an in-flight
# deploy is allowed to finish rather than shipping a half-uploaded asset set.
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mlz.no
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Set up mise (installs Bun from mise.toml)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: mise run build

      # wrangler is pinned as a devDependency, so the deploy uses the same
      # version CI tested against rather than whatever a marketplace action
      # resolves at run time.
      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
