<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="{{muted}}" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="{{accentDeep}}" />
    </marker>
  </defs>

  <rect width="1600" height="620" fill="{{bg}}" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="88" font-size="24" letter-spacing="4" fill="{{fg}}">RUNTIME TOPOLOGY</text>
    <text x="1536" y="88" font-size="14" letter-spacing="3" fill="{{muted}}" text-anchor="end">AT-LEAST-ONCE · KEYED BY TENANT</text>
    <line x1="64" y1="112" x2="1536" y2="112" stroke="{{border}}" stroke-width="2" />

    <!-- lane labels -->
    <text x="64" y="160" font-size="13" letter-spacing="3" fill="{{muted}}">01 · SOURCES</text>
    <text x="370" y="160" font-size="13" letter-spacing="3" fill="{{accentDeep}}">02 · INGEST</text>
    <text x="676" y="160" font-size="13" letter-spacing="3" fill="{{muted}}">03 · LOG</text>
    <text x="982" y="160" font-size="13" letter-spacing="3" fill="{{muted}}">04 · WORKERS</text>
    <text x="1288" y="160" font-size="13" letter-spacing="3" fill="{{muted}}">05 · SINKS</text>

    <!-- 01 sources -->
    <g fill="{{surface}}" stroke="{{border}}" stroke-width="2">
      <rect x="64" y="186" width="248" height="76" rx="6" />
      <rect x="64" y="282" width="248" height="76" rx="6" />
      <rect x="64" y="378" width="248" height="76" rx="6" />
    </g>
    <g font-size="17" fill="{{fg}}">
      <text x="88" y="222">checkout</text>
      <text x="88" y="318">catalog</text>
      <text x="88" y="414">payments</text>
    </g>
    <g font-size="13" fill="{{muted}}">
      <text x="88" y="243">14 svc · http</text>
      <text x="88" y="339">6 svc · http</text>
      <text x="88" y="435">3 svc · webhook</text>
    </g>

    <!-- 02 ingest -->
    <rect x="370" y="186" width="248" height="268" rx="6" fill="{{surface}}" stroke="{{accentDeep}}" stroke-width="3" />
    <rect x="370" y="186" width="6" height="268" rx="3" fill="{{accentDeep}}" />
    <text x="398" y="228" font-size="18" fill="{{fg}}">ingest-api</text>
    <line x1="398" y1="248" x2="594" y2="248" stroke="{{border}}" stroke-width="2" />
    <g font-size="14" fill="{{fgSecondary}}">
      <text x="398" y="284">schema registry</text>
      <text x="398" y="316">idempotency key</text>
      <text x="398" y="348">tenant partition</text>
      <text x="398" y="380">envelope + trace id</text>
    </g>
    <text x="398" y="424" font-size="13" letter-spacing="2" fill="{{accentDeep}}">REJECT → DLQ</text>

    <!-- 03 log -->
    <g stroke="{{border}}" stroke-width="2">
      <rect x="676" y="186" width="248" height="58" rx="6" fill="{{sunken}}" />
      <rect x="676" y="256" width="248" height="58" rx="6" fill="{{sunken}}" />
      <rect x="676" y="326" width="248" height="58" rx="6" fill="{{sunken}}" />
      <rect x="676" y="396" width="248" height="58" rx="6" fill="{{sunken}}" />
    </g>
    <g fill="{{accent}}">
      <rect x="676" y="186" width="6" height="58" rx="3" />
      <rect x="676" y="256" width="6" height="58" rx="3" />
      <rect x="676" y="326" width="6" height="58" rx="3" />
      <rect x="676" y="396" width="6" height="58" rx="3" />
    </g>
    <g font-size="15" fill="{{fg}}">
      <text x="702" y="221">events.p0</text>
      <text x="702" y="291">events.p1</text>
      <text x="702" y="361">events.p2</text>
      <text x="702" y="431">events.p3</text>
    </g>
    <g font-size="13" fill="{{muted}}" text-anchor="end">
      <text x="900" y="221">7d</text>
      <text x="900" y="291">7d</text>
      <text x="900" y="361">7d</text>
      <text x="900" y="431">7d</text>
    </g>

    <!-- 04 workers -->
    <g fill="{{surface}}" stroke="{{border}}" stroke-width="2">
      <rect x="982" y="186" width="248" height="76" rx="6" />
      <rect x="982" y="282" width="248" height="76" rx="6" />
      <rect x="982" y="378" width="248" height="76" rx="6" />
    </g>
    <g font-size="17" fill="{{fg}}">
      <text x="1006" y="222">enrich</text>
      <text x="1006" y="318">aggregate</text>
      <text x="1006" y="414">fan-out</text>
    </g>
    <g font-size="13" fill="{{muted}}">
      <text x="1006" y="243">stateless · 12 pods</text>
      <text x="1006" y="339">windowed · rocksdb</text>
      <text x="1006" y="435">retry w/ backoff</text>
    </g>

    <!-- 05 sinks -->
    <g fill="{{surface}}" stroke="{{border}}" stroke-width="2">
      <rect x="1288" y="186" width="248" height="76" rx="6" />
      <rect x="1288" y="282" width="248" height="76" rx="6" />
      <rect x="1288" y="378" width="248" height="76" rx="6" />
    </g>
    <g font-size="17" fill="{{fg}}">
      <text x="1312" y="222">warehouse</text>
      <text x="1312" y="318">search index</text>
      <text x="1312" y="414">webhooks</text>
    </g>
    <g font-size="13" fill="{{muted}}">
      <text x="1312" y="243">hourly batch</text>
      <text x="1312" y="339">near real-time</text>
      <text x="1312" y="435">customer facing</text>
    </g>

    <!-- flow -->
    <g stroke="{{muted}}" stroke-width="2" marker-end="url(#arrow)">
      <line x1="316" y1="320" x2="362" y2="320" />
      <line x1="622" y1="320" x2="668" y2="320" />
      <line x1="928" y1="320" x2="974" y2="320" />
      <line x1="1234" y1="320" x2="1280" y2="320" />
    </g>

    <!-- replay -->
    <path d="M1412 454 L1412 528 L800 528 L800 462" fill="none" stroke="{{accentDeep}}" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow-accent)" />
    <text x="1106" y="558" font-size="14" letter-spacing="3" fill="{{accentDeep}}" text-anchor="middle">REPLAY FROM STORED OFFSET</text>
  </g>
</svg>
