<!doctype html>
<!-- The 404 page. Firebase Hosting serves this file with a real 404 status for
     any unknown path, by virtue of it building to dist/404.html. -->

    <!--theme-init-->
    <meta name="format-detection" content="telephone=no" />

    <title>404 — Page Not Found · Martin Zachariassen</title>
    <meta name="description" content="The page you were looking for does not exist." />

    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ecebe4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161614" />

    <script
      defer
