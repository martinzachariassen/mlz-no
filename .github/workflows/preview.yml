name: Preview

on:
  pull_request:

env:
  PROJECT: mlz-no

permissions:
  contents: read
  id-token: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: deploy-preview
    # Fork and Dependabot PRs get no OIDC token; a skipped job counts as passing.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to preview channel
        id: deploy
        env:
          CHANNEL: pr-${{ github.event.pull_request.number }}
        run: |
          out="$(bunx firebase-tools hosting:channel:deploy "$CHANNEL" \
            --expires 7d --project "$PROJECT" --non-interactive --json)" || {
            echo "$out"
            exit 1
          }
          url="$(jq -r '.result[].url' <<< "$out" | head -n 1)"
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "$out"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url (expires in 7 days)" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test preview
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl -sfI "$URL/" | grep -qi '^content-security-policy:'
          curl -sfI "$URL/brand/tokens.css" | grep -qi '^access-control-allow-origin: \*'
