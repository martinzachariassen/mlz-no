name: CodeQL

# Weekly only. `main` is protected with strict status checks, so a PR's head is
# always up to date before merge and a push-to-main run would re-analyse bytes
# the PR run just cleared. The residual value here is the scheduled sweep —
# newly-disclosed patterns in code that hasn't changed — not per-PR gating: the
# app's entire untrusted-input surface is one `window.location.pathname` read
# rendered as a React text child, which is escaped by construction.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

# Least privilege at the top level; the analyze job elevates only the
# security-events write scope it needs to upload results to code scanning.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}

      # No build step: CodeQL analyzes the TypeScript source directly.
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:${{ matrix.language }}"
